name: Unpack GesturePilot archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract project files
        shell: bash
        run: |
          set -euo pipefail
          archive="GesturePilot_v20_Public_NonCommercial.zip"
          test -f "$archive"
          mkdir -p /tmp/gesturepilot-unpack
          unzip -q "$archive" -d /tmp/gesturepilot-unpack
          source_dir="$(find /tmp/gesturepilot-unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$source_dir"
          rsync -a --exclude='__pycache__/' --exclude='*.pyc' "$source_dir"/ ./
          rm -f "$archive"
          git status --short

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Publish GesturePilot source files"
          git push
