name: Build GesturePilot EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'assets/**'
      - '.github/workflows/build-exe.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GesturePilot --icon assets/gesturepilot.ico --add-data "assets;assets" --collect-all mediapipe --collect-all cv2 main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GesturePilot-Windows-x64
          path: dist/GesturePilot.exe
          if-no-files-found: error
          retention-days: 30
