name: Publish GesturePilot source from ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, 'Publish GesturePilot source files') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded archive
        run: |
          set -euo pipefail
          archive="GesturePilot_v20_Public_NonCommercial.zip"
          if [ ! -f "$archive" ]; then
            echo "Archive already extracted; nothing to do."
            exit 0
          fi
          mkdir -p /tmp/gesturepilot
          unzip -q "$archive" -d /tmp/gesturepilot
          source_dir="$(find /tmp/gesturepilot -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$source_dir"
          rsync -a --exclude='__pycache__/' --exclude='*.pyc' --exclude='.github/' "$source_dir"/ ./
          rm -f "$archive"
      - name: Commit source files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish GesturePilot source files"
          git push
